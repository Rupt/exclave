[project]
name = "exclave"
version = "0.1.0"
description = "Relocatable, privilege-free Linux software: a directory that runs by path."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The exclave command is C (tool/) and the steps before it, unpack/ and fetch/,
# are Go, all built by scripts/build. The Python here is the tests, on the
# pinned Python .python-version names, which uv installs and every script runs
# through (scripts/lib.sh). They use the standard library only, so there is
# nothing to depend on, and nothing to build: the project is its tests.
requires-python = ">=3.15"
dependencies = []

[tool.uv]
# Never borrow a Python from the machine, as the uv in .uv/ is never borrowed
# from PATH: what runs here should not depend on what is installed.
python-preference = "only-managed"
# No package: the tests are scripts, each importing its helpers as siblings.
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.92",
    # The shell scripts, the C and this file are code too. Each of these ships its
    # binary in a wheel, so uv installs it like any other dependency rather
    # than the machine having to provide it. shellcheck-py and taplo have no
    # Linux aarch64 wheel in any version, so an aarch64 machine goes without
    # them, and scripts/check says so: what they check is text, the same on
    # every machine, and checked on x86-64.
    "shellcheck-py>=0.11.0; platform_machine == 'x86_64'",
    "shfmt-py>=3.12.0",
    "taplo>=0.9.3; platform_machine == 'x86_64'",
    "clang-format>=23.1.3",
    "clang-tidy>=23.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py315"
# One line per finding: the full form repeats the source, which is already on
# screen in an editor and in the diff.
output-format = "concise"
# src/gdb.py runs inside gdb's own embedded Python, whatever version the
# machine's gdb was built with, not the pinned one.
per-file-target-version = { "src/gdb.py" = "py37" }

[tool.ruff.format]
# One layout per expression, whether or not somebody left a trailing comma.
skip-magic-trailing-comma = true
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstrings are checked when present, and required only of modules and
    # packages: a short function whose name says what it does is worse for a
    # sentence repeating it.
    "D101",
    "D102",
    "D103",
    "D105",
    "D106",
    "D107",
    # Conflicts with the formatter, which owns string layout.
    "COM812",
    "ISC001",
    # The licence is in LICENSE and in the launcher; a notice per file adds nothing.
    "CPY001",
    # Many keyword-only arguments are allowed, and preferred to a flag object.
    "PLR0913",
    # Kernel numbers, offsets and errnos are the subject here; a name for each
    # would hide the number a reader checks against the kernel's headers.
    "PLR2004",
    # Asserts narrow types and state invariants; none validates input, so
    # running with -O changes nothing.
    "S101",
    # Command-line tools and test drivers: print is their output.
    "T20",
    # Paths here are strings in two namespaces, the exclave's virtual paths and
    # the host's real ones, joined and compared as the kernel would; a Path would
    # invite treating a virtual path as a file on this machine.
    "PTH",
    # The tool's commands and the suite's tests are long, linear sequences of
    # checks in the order of the design's rules; splitting one to satisfy a
    # count would scatter the rule it follows.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"test/**" = [
    # Scripts in a directory, not a package.
    "INP001",
    # The tests run programs by design: the launcher, compilers, bwrap, QEMU.
    # Every argument vector is built from paths, never a shell string.
    "S603",
    "S607",
    # Tests make files in /tmp and give them odd modes on purpose: the kernel's
    # answers about exactly those are what they check.
    "S103",
    "S108",
    # Random trees and mazes for the oracles, not secrets.
    "S311",
]
"src/gdb.py" = [
    # Data the launcher carries for gdb, not part of a package.
    "INP001",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.15"
# The import root: test/, whose drivers import their helpers (tree, syscalls,
# oracle_ns, ...) as a script's siblings, from the directory Python puts first
# on a script's path.
root = ["test"]

[tool.ty.src]
include = ["test"]

[tool.ty.analysis]
# A `type: ignore` suppresses nothing: only `ty: ignore[<rule>]` does, so every
# suppression names what it hides.
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.ty.rules]
# The rules ty leaves off by default; every rule that warns is an error already
# (error-on-warning).
possibly-unresolved-reference = "error"
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
# A condition that is always true or always false is dead code or a mistake.
redundant-condition-strict = "error"
# Every suppression names the rule it hides.
blanket-ignore-comment = "error"
