[project]
name = "exclave"
version = "0.1.0"
description = "Relocatable, privilege-free Linux software: a directory that runs by path."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The pinned Python is .python-version; uv installs it, and every script runs
# through it (scripts/lib.sh). The tool and the tests use the standard library
# only, so there is nothing to depend on.
requires-python = ">=3.15"
dependencies = []

[project.scripts]
exclave = "exclave.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package is exclave/ at the top of the checkout, beside src/, the
# launcher's C. uv sync installs it into .venv in editable mode; the matrix's
# VMs and the tool's own exclave get it with `uv pip install --target`.
module-name = "exclave"
module-root = ""

[tool.uv]
# Never borrow a Python from the machine, as the uv in .uv/ is never borrowed
# from PATH: what runs here should not depend on what is installed.
python-preference = "only-managed"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.92",
    # The shell scripts and this file are code too. Each of these ships its
    # binary in a wheel, so uv installs it like any other dependency rather
    # than the machine having to provide it.
    "shellcheck-py>=0.11.0",
    "shfmt-py>=3.12.0",
    "taplo>=0.9.3",
]

[tool.ruff]
line-length = 100
target-version = "py315"
# One line per finding: the full form repeats the source, which is already on
# screen in an editor and in the diff.
output-format = "concise"
# src/gdb.py runs inside gdb's own embedded Python, whatever version the
# machine's gdb was built with, not the pinned one.
per-file-target-version = { "src/gdb.py" = "py37" }

[tool.ruff.format]
# One layout per expression, whether or not somebody left a trailing comma.
skip-magic-trailing-comma = true
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstrings are checked when present, not required: a short function whose
    # name says what it does is worse for a sentence repeating it.
    "D1",
    # Conflicts with the formatter, which owns string layout.
    "COM812",
    "ISC001",
    # The licence is in LICENSE and in the launcher; a notice per file adds nothing.
    "CPY001",
    # Many keyword-only arguments are allowed, and preferred to a flag object.
    "PLR0913",
    # Kernel numbers, offsets and errnos are the subject here; a name for each
    # would hide the number a reader checks against the kernel's headers.
    "PLR2004",
    # `assert` is for sanity checks, which is what it is for.
    "S101",
    # Command-line tools and test drivers: print is their output.
    "T20",
    # The tool and the tests run programs by design: the launcher, compilers,
    # bwrap, QEMU. Every argument vector is built from paths, never a shell string.
    "S603",
    "S607",
    # Paths here are strings in two namespaces, the exclave's virtual paths and
    # the host's real ones, joined and compared as the kernel would; a Path would
    # invite treating a virtual path as a file on this machine.
    "PTH",
    # The tool's commands and the suite's tests are long, linear sequences of
    # checks in the order of the design's rules; splitting one to satisfy a
    # count would scatter the rule it follows.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    # Scripts in directories, not packages.
    "INP001",
]

[tool.ruff.lint.per-file-ignores]
"test/**" = [
    # Tests make files in /tmp and give them odd modes on purpose: the kernel's
    # answers about exactly those are what they check.
    "S103",
    "S108",
    # Random trees and mazes for the oracles, not secrets.
    "S311",
    # A module imported inside the one test that needs it, so the suite starts
    # without it.
    "PLC0415",
]
"tools/**" = [
    # Fetching from the repository the caller names is the whole program.
    "S310",
    # Repository metadata from that repository, read without entities or
    # external references.
    "S314",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.15"
# The import roots: the checkout, for the exclave package, and test/, whose
# drivers import their helpers (tree, syscalls, oracle_ns, ...) as a script's
# siblings, from the directory Python puts first on a script's path.
root = [".", "test"]

[tool.ty.src]
include = ["exclave", "test", "tools"]

[tool.ty.analysis]
# A `type: ignore` suppresses nothing: only `ty: ignore[<rule>]` does, so every
# suppression names what it hides.
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"
deprecated = "error"
division-by-zero = "error"
index-out-of-bounds = "error"
invalid-ignore-comment = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
redundant-cast = "error"
