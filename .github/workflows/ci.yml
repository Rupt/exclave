# The commit gate and the kernel matrix on GitHub's hosted runners (docs/DESIGN.md 17), run by
# hand (workflow_dispatch: the Actions tab, or gh workflow run ci.yml -f matrix=true, false for
# the gate alone; gh run watch ID --exit-status waits) and never at a push. The workflow only calls the
# repository's scripts: scripts/install-uv for the pinned Python, scripts/install-go for the
# pinned Go, scripts/inputs for the
# development inputs through cached package files, scripts/gate --full and scripts/matrix. What
# it adds is what the runner lacks and the reference machine has: packages, the KVM device
# opened to the runner, and the AppArmor sysctl that denies user namespaces on Ubuntu 24.04.
#
# The gate runs on x86-64 and, natively, on aarch64, whose runner's kernel is the one the
# emulated noble-arm64 row boots, so that row has no job here. The matrix's x86-64 rows run
# under KVM, two VMs at a time. The 64 KB-page arm64 row has no job either: no hosted runner
# boots such a kernel or offers KVM on aarch64, and under TCG the row took two hours, so it runs
# from the reference machine when asked (scripts/matrix --only noble-arm64-64k). Each action is
# pinned by commit, as uv is by checksum.
name: gate and matrix
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: the kernel matrix too, after the gate
        type: boolean
        default: true
permissions:
  contents: read
env:
  INPUTS: /home/runner/inputs
jobs:
  gate:
    name: gate on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: packages the gate needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap strace gdb gpgv
          [ "$(uname -m)" != x86_64 ] || sudo apt-get install -y -q --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: unprivileged user namespaces, for bwrap
        run: sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: the pinned uv, its Python and its package cache, from the last run with the same pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-uv', '.python-version', 'uv.lock') }}
      - name: the pinned uv, its Python and the locked tools
        run: |
          scripts/install-uv
          ROOT=$PWD; . scripts/lib.sh; "$UV" sync --quiet --project "$ROOT"
      - name: the pinned Go, its modules and its build cache, from the last run with the same pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-go', 'go.mod', 'go.sum') }}
      - name: the pinned Go
        run: scripts/install-go
      - name: package files and sources the inputs are made from
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/exclave-debs
            ~/.cache/exclave-apks
            ~/.cache/exclave-rpms
            ~/inputs/src
          key: packages-${{ hashFiles('scripts/inputs', 'fetch/**') }}
          restore-keys: packages-
      - name: the development inputs
        run: scripts/inputs "$INPUTS"
      - name: the gate
        run: |
          case $(uname -m) in
          x86_64) ex=$INPUTS/gcc13.exclave ;;
          *) ex=$INPUTS/gcc13-arm64.exclave ;;
          esac
          EXCLAVE_TEST_INPUTS=$INPUTS scripts/gate --full --jobs "$(nproc)" "$ex"
      - name: the gate's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ matrix.runner }}
          path: |
            build/gate/*.log
            ~/inputs/log/*.log
          if-no-files-found: ignore
  matrix:
    name: kernel matrix, the x86-64 rows
    needs: gate
    if: ${{ inputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: packages the matrix needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: the KVM device, opened to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: the runner's second disk, for the VMs' overlays; the images stay on the first
        run: |
          sudo mkdir -p /mnt/matrix && sudo chown "$(id -u):$(id -g)" /mnt/matrix
          df -h / /mnt
      - name: the pinned uv, its Python and its package cache, from the last run with the same pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-uv', '.python-version', 'uv.lock') }}
      - name: the pinned uv, its Python and the locked tools
        run: |
          scripts/install-uv
          ROOT=$PWD; . scripts/lib.sh; "$UV" sync --quiet --project "$ROOT"
      - name: the pinned Go, its modules and its build cache, from the last run with the same pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-go', 'go.mod', 'go.sum') }}
      - name: the pinned Go
        run: scripts/install-go
      - name: package files and sources the inputs are made from
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/exclave-debs
            ~/.cache/exclave-apks
            ~/.cache/exclave-rpms
            ~/inputs/src
          key: packages-${{ hashFiles('scripts/inputs', 'fetch/**') }}
          restore-keys: packages-
      - name: the development inputs
        run: scripts/inputs "$INPUTS"
      - name: the matrix
        run: >
          scripts/matrix --exclave "$INPUTS/gcc13.exclave"
          --jobs 2 --work /mnt/matrix/work
          --docker-profile "$INPUTS/src/docker-seccomp.json"
      - name: the rows' results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix
          path: |
            build/matrix-results.md
            /mnt/matrix/work/*.log
            ~/inputs/log/*.log
          if-no-files-found: ignore
