# The commit gate and the kernel matrix on GitHub's hosted runners (docs/DESIGN.md 17), run by
# hand (workflow_dispatch: the Actions tab, or gh workflow run ci.yml -f matrix=true, false for
# the gate alone; gh run watch ID --exit-status waits) and never at a push. The workflow only calls the
# repository's scripts: scripts/install-uv for the pinned Python, scripts/install-go for the
# pinned Go and scripts/inputs for the development inputs a job uses through cached package files,
# the three in the one setup both jobs share (.github/actions/setup); then scripts/gate --full
# and scripts/matrix. The suite's pruned fixture (docs/DESIGN.md 17) is kept in the cache by the
# gate, which makes or refreshes it, and restored by the matrix, which carries it into its VMs; a
# fixture made with other sources serves too, as it does on the reference machine. What
# it adds is what the runner lacks and the reference machine has: packages, the KVM device
# opened to the runner, the AppArmor sysctl that denies user namespaces on Ubuntu 24.04, and a
# first compile by the runner's rustc, made before the gate, where no test's budget runs.
#
# The gate runs on x86-64 and, natively, on aarch64, whose runner's kernel has 4 KB pages, as
# the emulated noble-arm64 row's has, so that row has no job here. The matrix's x86-64 rows run
# under KVM, two VMs at a time. The 64 KB-page arm64 row has no job either: no hosted runner
# boots such a kernel or offers KVM on aarch64, and under TCG the row took two hours, so it runs
# from the reference machine when asked (scripts/matrix --only noble-arm64-64k). Each action is
# pinned by commit, as uv is by checksum.
name: gate and matrix
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: the kernel matrix too, after the gate
        type: boolean
        default: true
permissions:
  contents: read
env:
  INPUTS: ${{ github.workspace }}/build/inputs
jobs:
  gate:
    name: gate on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            inputs: gcc13 sss gdb caches alpine-caches docker-seccomp
          - runner: ubuntu-24.04-arm
            inputs: gcc13-arm64 sss gdb caches docker-seccomp
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: packages the gate needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap strace gdb
          [ "$(uname -m)" != x86_64 ] || sudo apt-get install -y -q --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: unprivileged user namespaces, for bwrap
        run: sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: the pinned uv and Go and the development inputs, through their caches
        uses: ./.github/actions/setup
        with:
          names: ${{ matrix.inputs }}
      - name: the suite's pruned fixture, from the last run with the same sources or another
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fixtures
          key: fixtures-${{ runner.arch }}-${{ hashFiles('test/regress_*.py', 'test/run.py', 'test/harness.py', 'test/suite.py', 'test/tree.py', 'test/packages.py', 'test/progs/**', 'src/**', 'tool/**', 'unpack/**') }}
          restore-keys: fixtures-${{ runner.arch }}-
      # the Rust test's compile on a runner has outlasted the test's budget while its rustc
      # --version answered at once; a compile here leaves the toolchain read, its time in the log
      - name: the runner's rustc, compiling once before a test's budget runs
        run: |
          rustc=$(command -v rustc || echo "$HOME/.cargo/bin/rustc")
          [ -x "$rustc" ] || exit 0
          mkdir -p build/tmp
          time RUSTUP_AUTO_INSTALL=0 "$rustc" -O -o build/tmp/rs test/progs/rs.rs || true
      - name: the gate
        run: |
          case $(uname -m) in
          x86_64) ex=$INPUTS/gcc13.exclave ;;
          *) ex=$INPUTS/gcc13-arm64.exclave ;;
          esac
          EXCLAVE_TEST_INPUTS=$INPUTS scripts/gate --full --jobs "$(nproc)" "$ex"
      - name: the gate's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ matrix.runner }}
          path: |
            build/gate/*.log
            build/inputs/log/*.log
          if-no-files-found: ignore
  matrix:
    name: kernel matrix, the x86-64 rows
    needs: gate
    if: ${{ inputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: packages the matrix needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: the KVM device, opened to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: the runner's second disk, for the VMs' overlays; the images stay on the first
        run: |
          sudo mkdir -p /mnt/matrix && sudo chown "$(id -u):$(id -g)" /mnt/matrix
          df -h / /mnt
      - name: the pinned uv and Go and the development inputs, through their caches
        uses: ./.github/actions/setup
        with:
          names: gcc13 docker-seccomp
      - name: the suite's pruned fixture the gate kept, which the VMs run on
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fixtures
          key: fixtures-${{ runner.arch }}-${{ hashFiles('test/regress_*.py', 'test/run.py', 'test/harness.py', 'test/suite.py', 'test/tree.py', 'test/packages.py', 'test/progs/**', 'src/**', 'tool/**', 'unpack/**') }}
          restore-keys: fixtures-${{ runner.arch }}-
      # Rocky's image is 2 GB, which its mirror serves in minutes and the cache in seconds; kept a
      # week, so that the row still meets the image's updates
      - name: the week, which names Rocky's image in the cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Rocky's image, from the cache this week
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/images/rocky-8.qcow2
          key: image-rocky-8-${{ steps.week.outputs.week }}
      - name: the matrix
        run: >
          scripts/matrix --exclave "$INPUTS/gcc13.exclave"
          --jobs 2 --work /mnt/matrix/work
          --docker-profile "$INPUTS/src/docker-seccomp.json"
      - name: the rows' results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix
          path: |
            build/matrix-results.md
            /mnt/matrix/work/*.log
            build/inputs/log/*.log
          if-no-files-found: ignore
